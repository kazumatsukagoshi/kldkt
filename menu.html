<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Menu</title>
    <style>
        * {
            box-sizing: border-box; /* パディングを含めて幅を計算する */
            }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            padding: 0;
            width: 100vw;       /* 画面の幅ぴったりにする */
            overflow-x: hidden;  /* 横方向のはみ出しを強制的に隠す */
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .menu-container {
            max-width: 400px;
            width: 90%;        /* 親要素（body）を超えないようにする */
            padding: 0 20px;    /* 左右に少し余白が欲しい場合はここを調整 */
        }
        .nav-button {
            display: block;
            width: 100%;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
            text-decoration: none;
            color: white;
            background-color: #007AFF; /* iOS Blue */
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
        }
        .nav-button:active {
            transform: scale(0.98);
            background-color: #0051a8;
        }
        .nav-button.secondary {
            background-color: #5856D6; /* iOS Purple */
        }
        .nav-button.tertiary {
            background-color: #AF52DE; /* iOS Indigo */
        }
    </style>
</head>
<body>

    <h1>メインメニュー</h1>

    <div class="menu-container">
        <a href="https://kazumatsukagoshi.github.io/kldkt/" class="nav-button">
            kldkt
        </a>
        
        <a href="https://kazumatsukagoshi.github.io/kldkt/raccoon.html" class="nav-button secondary">
            Raccoon
        </a>
        
        <a href="https://kazumatsukagoshi.github.io/kldkt/seg.html" class="nav-button tertiary">
            SEG
        </a>
    </div>

</body>
</html>
